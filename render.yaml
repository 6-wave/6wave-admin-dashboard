# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy: push this repo to GitHub, then in Render choose New + → Blueprint.
services:
  - type: web
    name: sound-wave-admin
    runtime: static
    # Bun is picked up from bun.lock; its version comes from .bun-version, Node's from .node-version.
    buildCommand: bun install --frozen-lockfile && bun run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      # A single-page app: every path must serve index.html, or refreshing /users/123 gives a 404.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin
    envVars:
      # Set to the deployed backend's URL. Baked in at build time.
      - key: VITE_API_BASE_URL
        sync: false
