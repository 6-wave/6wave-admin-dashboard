<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0d0a0a" />
    <title>Sound Wave Admin</title>
    <script>
      // Apply the saved theme before first paint to avoid a light flash in dark mode.
      // Keep the fallback ("dark") in sync with defaultTheme in src/main.tsx.
      try {
        var t = localStorage.getItem('theme') || 'dark'
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
